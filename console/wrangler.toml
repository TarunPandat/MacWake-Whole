name = "macwake"
main = "worker.js"
compatibility_date = "2026-01-01"

[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_ID"

# Pairing is open to any Mac; this caps new pairings per IP so nobody can burn the KV write quota.
[[ratelimits]]
name = "REGISTER_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
